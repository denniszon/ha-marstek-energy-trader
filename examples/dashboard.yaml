# Full dashboard for Marstek Energy Trader (all cards from this folder).
# Settings → Dashboards → Add dashboard → open it → ⋮ → Edit → ⋮ → Raw
# configuration editor, and paste this file.
# Requires apexcharts-card (HACS → Frontend). In the last chart, replace
# sensor.marstek_battery_soc and sensor.marstek_battery_power with the entities of
# your Marstek. The separate files in this folder explain each card.
title: Batterij
views:
- title: Batterij
  path: batterij
  icon: mdi:home-battery
  cards:
  - type: markdown
    title: Batterij-handelaar
    content: |
      {% set status = states('sensor.marstek_energy_trader_status') %}
      {% set names = {'charge': '🔋 Laden', 'discharge': '⚡ Ontladen', 'hold': '⏸️ Vasthouden',
         'self_consumption': '🏠 Zelfverbruik', 'off': '⏹️ Uit', 'waiting': '⏳ Wacht op gegevens',
         'error': '⚠️ Fout'} %}
      {% if is_state('switch.marstek_energy_trader_dry_run', 'on') %}
      > 🧪 **Proefdraaien**: er wordt niets naar de Marstek gestuurd.
      {% endif %}
      **{{ names.get(status, status) }}**
      {%- set power = state_attr('sensor.marstek_energy_trader_status', 'power_w') %}
      {%- if power %} · {{ power }} W{% endif %}

      {{ state_attr('sensor.marstek_energy_trader_status', 'reason') }}

      {% set until = state_attr('sensor.marstek_energy_trader_status', 'override_until') %}
      {% if until %}✋ Handmatig tot {{ as_timestamp(until) | timestamp_custom('%H:%M') }}{% endif %}
      {% set error = state_attr('sensor.marstek_energy_trader_status', 'last_error') %}
      {% if error %}⚠️ {{ error }}{% endif %}

      | Tijd | Actie | Prijs | Batterij | Waarom |
      |:--|:--|--:|--:|:--|
      {% for s in (state_attr('sensor.marstek_energy_trader_plan', 'plan') or [])[:12] -%}
      | {{ as_timestamp(s.start) | timestamp_custom('%H:%M') }} | {{ names.get(s.action, s.action) }}{% if s.override %} ✋{% endif %} | €{{ '%.2f' | format(s.buy) }} | {{ s.soc_end | round(0) | int }}% | {{ s.reason }} |
      {% endfor %}
  - type: custom:apexcharts-card
    header:
      show: true
      title: Planning batterij
      show_states: true
    graph_span: 36h
    span:
      start: hour
    now:
      show: true
      label: Nu
    stacked: true
    yaxis:
    - id: price
      min: '~0'
      decimals: 2
      apex_config:
        title:
          text: €/kWh
    - id: soc
      opposite: true
      min: 0
      max: 100
      decimals: 0
      apex_config:
        title:
          text: Batterij %
    apex_config:
      legend:
        show: true
        # One row instead of a list per stack group.
        clusterGroupedSeries: false
      plotOptions:
        bar:
          columnWidth: 85%
          borderRadius: 3
      xaxis:
        tooltip:
          enabled: false
      tooltip:
        shared: false
        # Always in the top right of the chart, so it never falls outside the card.
        fixed:
          enabled: true
          position: topRight
        # Compact box that wraps long reasons.
        custom: |
          EVAL:function({ seriesIndex, dataPointIndex, w }) {
            const x = w.globals.seriesX[seriesIndex][dataPointIndex];
            const plan = window.marstekTraderPlan || [];
            // Bars sit inside their slot, battery level points on the slot end.
            const isLine = w.config.series[seriesIndex].type === 'line';
            const slot = plan.find((s) => (isLine ? x <= new Date(s.end).getTime() : x < new Date(s.end).getTime()));
            if (!slot) return '';
            const time = (v) => new Date(v).toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' });
            const names = { charge: 'Laden', discharge: 'Ontladen', hold: 'Vasthouden', self_consumption: 'Zelfverbruik' };
            return '<div style="padding:6px 10px;max-width:240px;white-space:normal;line-height:1.4">'
              + '<b>' + time(slot.start) + ' - ' + time(slot.end) + ' · ' + (names[slot.action] || slot.action) + '</b><br>'
              + '€' + Number(slot.buy).toFixed(2) + '/kWh · batterij ' + Math.round(slot.soc_end) + '%'
              + (slot.reason ? '<br>' + slot.reason : '')
              + '</div>';
          }
    series:
    - entity: sensor.marstek_energy_trader_plan
      name: Laden
      type: column
      yaxis_id: price
      stack_group: plan
      color: '#1a9850'
      unit: €/kWh
      float_precision: 2
      show:
        in_header: false
        legend_value: false
      data_generator: |
        const plan = entity.attributes.plan || [];
        window.marstekTraderPlan = plan;
        const len = plan.length > 1 ? new Date(plan[1].end) - new Date(plan[1].start) : 3600000;
        return plan.map((s) => [new Date(s.end).getTime() - len / 2, s.action === 'charge' ? s.buy : null]);
    - entity: sensor.marstek_energy_trader_plan
      name: Ontladen
      type: column
      yaxis_id: price
      stack_group: plan
      color: '#d73027'
      unit: €/kWh
      float_precision: 2
      show:
        in_header: false
        legend_value: false
      data_generator: |
        const plan = entity.attributes.plan || [];
        const len = plan.length > 1 ? new Date(plan[1].end) - new Date(plan[1].start) : 3600000;
        return plan.map((s) => [new Date(s.end).getTime() - len / 2, s.action === 'discharge' ? s.buy : null]);
    - entity: sensor.marstek_energy_trader_plan
      name: Vasthouden
      type: column
      yaxis_id: price
      stack_group: plan
      color: '#9e9e9e'
      unit: €/kWh
      float_precision: 2
      show:
        in_header: false
        legend_value: false
      data_generator: |
        const plan = entity.attributes.plan || [];
        const len = plan.length > 1 ? new Date(plan[1].end) - new Date(plan[1].start) : 3600000;
        return plan.map((s) => [new Date(s.end).getTime() - len / 2, s.action === 'hold' ? s.buy : null]);
    - entity: sensor.marstek_energy_trader_plan
      name: Zelfverbruik
      type: column
      yaxis_id: price
      stack_group: plan
      color: '#4575b4'
      unit: €/kWh
      float_precision: 2
      show:
        in_header: false
        legend_value: false
      data_generator: |
        const plan = entity.attributes.plan || [];
        const len = plan.length > 1 ? new Date(plan[1].end) - new Date(plan[1].start) : 3600000;
        return plan.map((s) => [new Date(s.end).getTime() - len / 2, s.action === 'self_consumption' ? s.buy : null]);
    - entity: sensor.marstek_energy_trader_plan
      name: Batterij
      type: line
      curve: straight
      stroke_width: 3
      yaxis_id: soc
      color: var(--primary-color)
      unit: '%'
      float_precision: 0
      show:
        in_header: false
        legend_value: false
      data_generator: |
        const plan = entity.attributes.plan || [];
        if (!plan.length) return [];
        const len = plan.length > 1 ? new Date(plan[1].end) - new Date(plan[1].start) : 3600000;
        return [[new Date(plan[0].end).getTime() - len, plan[0].soc_start]].concat(
          plan.map((s) => [new Date(s.end).getTime(), s.soc_end]));
    - entity: sensor.marstek_energy_trader_plan
      name: Verwachte besparing
      unit: €
      float_precision: 2
      show:
        in_chart: false
  - type: custom:apexcharts-card
    header:
      show: true
      title: Energieplanning
    graph_span: 36h
    span:
      start: hour
    now:
      show: true
      label: Nu
    yaxis:
    - decimals: 0
      apex_config:
        title:
          text: W
    apex_config:
      legend:
        show: true
      plotOptions:
        bar:
          columnWidth: 85%
    series:
    - entity: sensor.marstek_energy_trader_plan
      name: Batterij
      type: column
      unit: W
      float_precision: 0
      color: '#1a9850'
      color_threshold:
      - value: -10000
        color: '#d73027'
      - value: 0
        color: '#1a9850'
      data_generator: |
        const plan = entity.attributes.plan || [];
        const len = plan.length > 1 ? new Date(plan[1].end) - new Date(plan[1].start) : 3600000;
        return plan.map((s) => [new Date(s.end).getTime() - len / 2, s.power_w]);
    - entity: sensor.marstek_energy_trader_plan
      name: Zon (verwacht)
      type: area
      curve: stepline
      opacity: 0.3
      color: '#fdae61'
      unit: W
      float_precision: 0
      data_generator: |
        const plan = entity.attributes.plan || [];
        const len = plan.length > 1 ? new Date(plan[1].end) - new Date(plan[1].start) : 3600000;
        return plan.map((s) => {
          const hours = (new Date(s.end) - new Date(s.start)) / 3600000;
          return [new Date(s.end).getTime() - len, Math.round(s.solar_kwh / hours * 1000)];
        });
    - entity: sensor.marstek_energy_trader_plan
      name: Verbruik (verwacht)
      type: line
      curve: stepline
      stroke_width: 2
      color: var(--primary-text-color)
      unit: W
      float_precision: 0
      data_generator: |
        const plan = entity.attributes.plan || [];
        const len = plan.length > 1 ? new Date(plan[1].end) - new Date(plan[1].start) : 3600000;
        return plan.map((s) => {
          const hours = (new Date(s.end) - new Date(s.start)) / 3600000;
          return [new Date(s.end).getTime() - len, Math.round(s.load_kwh / hours * 1000)];
        });
    experimental:
      color_threshold: true
  - type: entities
    title: Instellingen batterij
    entities:
    - entity: select.marstek_energy_trader_mode
    - entity: switch.marstek_energy_trader_dry_run
    - type: section
      label: Hoe agressief
    - entity: select.marstek_energy_trader_strategy
    - entity: number.marstek_energy_trader_min_profit
    - entity: number.marstek_energy_trader_min_soc
    - entity: number.marstek_energy_trader_max_soc
    - entity: number.marstek_energy_trader_max_charge_power
    - entity: number.marstek_energy_trader_max_discharge_power
    - entity: number.marstek_energy_trader_forecast_trust
    - entity: switch.marstek_energy_trader_allow_grid_export
    - type: section
      label: Handmatig ingrijpen
    - entity: select.marstek_energy_trader_override
    - entity: number.marstek_energy_trader_override_hours
    - entity: button.marstek_energy_trader_replan
  - type: vertical-stack
    cards:
    - type: glance
      title: Besparing
      columns: 4
      entities:
      - entity: sensor.marstek_energy_trader_savings_today
        name: Vandaag
      - entity: sensor.marstek_energy_trader_savings_total
        name: Totaal
      - entity: sensor.marstek_energy_trader_plan
        name: Planning
      - entity: sensor.marstek_energy_trader_average_stored_price
        name: Prijs in batterij
    - type: statistics-graph
      title: Besparing per dag
      chart_type: bar
      period: day
      days_to_show: 30
      stat_types:
      - change
      entities:
      - entity: sensor.marstek_energy_trader_savings_total
        name: Gemeten
      - entity: sensor.marstek_energy_trader_planned_savings_total
        name: Verwacht
    - type: statistics-graph
      title: Besparing per maand
      chart_type: bar
      period: month
      days_to_show: 365
      stat_types:
      - change
      entities:
      - entity: sensor.marstek_energy_trader_savings_total
        name: Gemeten
    - type: statistics-graph
      title: Energiestromen per dag
      chart_type: bar
      period: day
      days_to_show: 14
      stat_types:
      - change
      entities:
      - entity: sensor.marstek_energy_trader_grid_to_battery
        name: Net → batterij
      - entity: sensor.marstek_energy_trader_solar_to_battery
        name: Zon → batterij
      - entity: sensor.marstek_energy_trader_battery_to_home
        name: Batterij → huis
      - entity: sensor.marstek_energy_trader_battery_to_grid
        name: Batterij → net
  - type: custom:apexcharts-card
    header:
      show: true
      title: Werkelijk en gepland
    graph_span: 24h
    yaxis:
    - id: soc
      min: 0
      max: 100
      decimals: 0
    - id: power
      opposite: true
      decimals: 0
    apex_config:
      legend:
        show: true
    series:
    - entity: sensor.marstek_battery_soc
      name: Batterij (werkelijk)
      yaxis_id: soc
      stroke_width: 2
      color: var(--primary-color)
    - entity: sensor.marstek_energy_trader_planned_soc
      name: Batterij (gepland)
      yaxis_id: soc
      stroke_width: 2
      curve: stepline
      color: '#9e9e9e'
    - entity: sensor.marstek_battery_power
      name: Vermogen (werkelijk)
      yaxis_id: power
      type: area
      opacity: 0.2
      color: '#1a9850'
      group_by:
        func: avg
        duration: 5min
      transform: return -x;
    - entity: sensor.marstek_energy_trader_target_power
      name: Vermogen (gepland)
      yaxis_id: power
      curve: stepline
      stroke_width: 2
      color: '#d73027'
