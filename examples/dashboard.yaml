# Full dashboard for Marstek Energy Trader (all cards from this folder).
# Settings → Dashboards → Add dashboard → open it → ⋮ → Edit → ⋮ → Raw
# configuration editor, and paste this file.
# Requires apexcharts-card (HACS → Frontend). In the last chart, replace
# sensor.marstek_battery_soc and sensor.marstek_battery_power with the entities of
# your Marstek. The separate files in this folder explain each card.
title: Batterij
views:
- title: Batterij
  path: batterij
  icon: mdi:home-battery
  cards:
  - type: markdown
    title: Batterij-handelaar
    content: |
      {% set status = states('sensor.marstek_energy_trader_status') %}
      {% set names = {'charge': '🔋 Laden', 'discharge': '⚡ Ontladen', 'hold': '⏸️ Vasthouden',
         'self_consumption': '🏠 Zelfverbruik', 'off': '⏹️ Uit', 'waiting': '⏳ Wacht op gegevens',
         'error': '⚠️ Fout'} %}
      {% if is_state('switch.marstek_energy_trader_dry_run', 'on') %}
      > 🧪 **Proefdraaien**: er wordt niets naar de Marstek gestuurd.
      {% endif %}
      **{{ names.get(status, status) }}**
      {%- set power = state_attr('sensor.marstek_energy_trader_status', 'power_w') %}
      {%- if power %} · {{ power }} W{% endif %}

      {{ state_attr('sensor.marstek_energy_trader_status', 'reason') }}

      {% set until = state_attr('sensor.marstek_energy_trader_status', 'override_until') %}
      {% if until %}✋ Handmatig tot {{ as_timestamp(until) | timestamp_custom('%H:%M') }}{% endif %}
      {% set error = state_attr('sensor.marstek_energy_trader_status', 'last_error') %}
      {% if error %}⚠️ {{ error }}{% endif %}

      | Tijd | Actie | Prijs | Batterij | Waarom |
      |:--|:--|--:|--:|:--|
      {% for s in (state_attr('sensor.marstek_energy_trader_plan', 'plan') or [])[:12] -%}
      | {{ as_timestamp(s.start) | timestamp_custom('%H:%M') }} | {{ names.get(s.action, s.action) }}{% if s.override %} ✋{% endif %} | €{{ '%.2f' | format(s.buy) }} | {{ s.soc_end | round(0) | int }}% | {{ s.reason }} |
      {% endfor %}
  - type: custom:apexcharts-card
    header:
      show: true
      title: Planning batterij
      show_states: true
    graph_span: 36h
    span:
      start: hour
    now:
      show: true
      label: Nu
    stacked: true
    yaxis:
    - id: price
      decimals: 2
      apex_config:
        title:
          text: €/kWh
    - id: soc
      opposite: true
      min: 0
      max: 100
      decimals: 0
      apex_config:
        title:
          text: Batterij %
    apex_config:
      legend:
        show: true
      plotOptions:
        bar:
          columnWidth: 85%
          borderRadius: 3
      tooltip:
        shared: true
        x:
          formatter: |
            EVAL:function(value) {
              const time = (ms) => new Date(ms).toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' });
              const plan = window.marstekTraderPlan || [];
              const slot = plan.find((s) => new Date(s.start).getTime() <= value && value < new Date(s.end).getTime());
              const range = time(value) + ' - ' + time(slot ? new Date(slot.end).getTime() : value + 3600000);
              return slot && slot.reason ? range + ' · ' + slot.reason : range;
            }
    series:
    - entity: sensor.marstek_energy_trader_plan
      name: Laden
      type: column
      yaxis_id: price
      color: '#1a9850'
      unit: €/kWh
      float_precision: 2
      show:
        in_header: false
      data_generator: |
        const plan = entity.attributes.plan || [];
        window.marstekTraderPlan = plan;
        return plan.map((s) => [new Date(s.start).getTime(), s.action === 'charge' ? s.buy : null]);
    - entity: sensor.marstek_energy_trader_plan
      name: Ontladen
      type: column
      yaxis_id: price
      color: '#d73027'
      unit: €/kWh
      float_precision: 2
      show:
        in_header: false
      data_generator: |
        const plan = entity.attributes.plan || [];
        return plan.map((s) => [new Date(s.start).getTime(), s.action === 'discharge' ? s.buy : null]);
    - entity: sensor.marstek_energy_trader_plan
      name: Vasthouden
      type: column
      yaxis_id: price
      color: '#9e9e9e'
      unit: €/kWh
      float_precision: 2
      show:
        in_header: false
      data_generator: |
        const plan = entity.attributes.plan || [];
        return plan.map((s) => [new Date(s.start).getTime(), s.action === 'hold' ? s.buy : null]);
    - entity: sensor.marstek_energy_trader_plan
      name: Zelfverbruik
      type: column
      yaxis_id: price
      color: '#4575b4'
      unit: €/kWh
      float_precision: 2
      show:
        in_header: false
      data_generator: |
        const plan = entity.attributes.plan || [];
        return plan.map((s) => [new Date(s.start).getTime(), s.action === 'self_consumption' ? s.buy : null]);
    - entity: sensor.marstek_energy_trader_plan
      name: Batterij
      type: line
      curve: straight
      stroke_width: 3
      yaxis_id: soc
      color: var(--primary-color)
      unit: '%'
      float_precision: 0
      show:
        in_header: false
      data_generator: |
        const plan = entity.attributes.plan || [];
        if (!plan.length) return [];
        return [[new Date(plan[0].start).getTime(), plan[0].soc_start]].concat(
          plan.map((s) => [new Date(s.end).getTime(), s.soc_end]));
    - entity: sensor.marstek_energy_trader_plan
      name: Verwachte besparing
      unit: €
      float_precision: 2
      show:
        in_chart: false
  - type: custom:apexcharts-card
    header:
      show: true
      title: Energieplanning
    graph_span: 36h
    span:
      start: hour
    now:
      show: true
      label: Nu
    yaxis:
    - decimals: 0
      apex_config:
        title:
          text: W
    apex_config:
      legend:
        show: true
      plotOptions:
        bar:
          columnWidth: 85%
    series:
    - entity: sensor.marstek_energy_trader_plan
      name: Batterij
      type: column
      unit: W
      float_precision: 0
      color: '#1a9850'
      color_threshold:
      - value: -10000
        color: '#d73027'
      - value: 0
        color: '#1a9850'
      data_generator: |
        return (entity.attributes.plan || []).map((s) => [new Date(s.start).getTime(), s.power_w]);
    - entity: sensor.marstek_energy_trader_plan
      name: Zon (verwacht)
      type: area
      curve: stepline
      opacity: 0.3
      color: '#fdae61'
      unit: W
      float_precision: 0
      data_generator: |
        return (entity.attributes.plan || []).map((s) => {
          const hours = (new Date(s.end) - new Date(s.start)) / 3600000;
          return [new Date(s.start).getTime(), Math.round(s.solar_kwh / hours * 1000)];
        });
    - entity: sensor.marstek_energy_trader_plan
      name: Verbruik (verwacht)
      type: line
      curve: stepline
      stroke_width: 2
      color: var(--primary-text-color)
      unit: W
      float_precision: 0
      data_generator: |
        return (entity.attributes.plan || []).map((s) => {
          const hours = (new Date(s.end) - new Date(s.start)) / 3600000;
          return [new Date(s.start).getTime(), Math.round(s.load_kwh / hours * 1000)];
        });
    experimental:
      color_threshold: true
  - type: entities
    title: Instellingen batterij
    entities:
    - entity: select.marstek_energy_trader_mode
    - entity: switch.marstek_energy_trader_dry_run
    - type: section
      label: Hoe agressief
    - entity: select.marstek_energy_trader_strategy
    - entity: number.marstek_energy_trader_min_profit
    - entity: number.marstek_energy_trader_min_soc
    - entity: number.marstek_energy_trader_max_soc
    - entity: number.marstek_energy_trader_max_charge_power
    - entity: number.marstek_energy_trader_max_discharge_power
    - entity: number.marstek_energy_trader_forecast_trust
    - entity: switch.marstek_energy_trader_allow_grid_export
    - type: section
      label: Handmatig ingrijpen
    - entity: select.marstek_energy_trader_override
    - entity: number.marstek_energy_trader_override_hours
    - entity: button.marstek_energy_trader_replan
  - type: vertical-stack
    cards:
    - type: glance
      title: Besparing
      columns: 4
      entities:
      - entity: sensor.marstek_energy_trader_savings_today
        name: Vandaag
      - entity: sensor.marstek_energy_trader_savings_total
        name: Totaal
      - entity: sensor.marstek_energy_trader_plan
        name: Planning
      - entity: sensor.marstek_energy_trader_average_stored_price
        name: Prijs in batterij
    - type: statistics-graph
      title: Besparing per dag
      chart_type: bar
      period: day
      days_to_show: 30
      stat_types:
      - change
      entities:
      - entity: sensor.marstek_energy_trader_savings_total
        name: Gemeten
      - entity: sensor.marstek_energy_trader_planned_savings_total
        name: Verwacht
    - type: statistics-graph
      title: Besparing per maand
      chart_type: bar
      period: month
      days_to_show: 365
      stat_types:
      - change
      entities:
      - entity: sensor.marstek_energy_trader_savings_total
        name: Gemeten
    - type: statistics-graph
      title: Energiestromen per dag
      chart_type: bar
      period: day
      days_to_show: 14
      stat_types:
      - change
      entities:
      - entity: sensor.marstek_energy_trader_grid_to_battery
        name: Net → batterij
      - entity: sensor.marstek_energy_trader_solar_to_battery
        name: Zon → batterij
      - entity: sensor.marstek_energy_trader_battery_to_home
        name: Batterij → huis
      - entity: sensor.marstek_energy_trader_battery_to_grid
        name: Batterij → net
  - type: custom:apexcharts-card
    header:
      show: true
      title: Werkelijk en gepland
    graph_span: 24h
    yaxis:
    - id: soc
      min: 0
      max: 100
      decimals: 0
    - id: power
      opposite: true
      decimals: 0
    apex_config:
      legend:
        show: true
    series:
    - entity: sensor.marstek_battery_soc
      name: Batterij (werkelijk)
      yaxis_id: soc
      stroke_width: 2
      color: var(--primary-color)
    - entity: sensor.marstek_energy_trader_planned_soc
      name: Batterij (gepland)
      yaxis_id: soc
      stroke_width: 2
      curve: stepline
      color: '#9e9e9e'
    - entity: sensor.marstek_battery_power
      name: Vermogen (werkelijk)
      yaxis_id: power
      type: area
      opacity: 0.2
      color: '#1a9850'
      group_by:
        func: avg
        duration: 5min
      transform: return -x;
    - entity: sensor.marstek_energy_trader_target_power
      name: Vermogen (gepland)
      yaxis_id: power
      curve: stepline
      stroke_width: 2
      color: '#d73027'
