# Planning: price per hour coloured by the planned action, plus the planned
# battery level. Hover a bar to see why the trader chose that action.
# Requires apexcharts-card (HACS → Frontend).
#
# Colours: green = charge, red = discharge, grey = hold, blue = house uses battery
# (self-consumption). A bar with a dark outline is a manual override.
type: custom:apexcharts-card
header:
  show: true
  title: Planning batterij
  show_states: true
graph_span: 36h
span:
  start: hour
now:
  show: true
  label: Nu
# The columns share one stack_group so each slot shows one full-width bar.
stacked: true
yaxis:
  - id: price
    min: '~0'
    decimals: 2
    apex_config:
      title:
        text: €/kWh
  - id: soc
    opposite: true
    min: 0
    max: 100
    decimals: 0
    apex_config:
      title:
        text: Batterij %
apex_config:
  legend:
    show: true
    # One row instead of a list per stack group.
    clusterGroupedSeries: false
  plotOptions:
    bar:
      columnWidth: "85%"
      borderRadius: 3
  xaxis:
    tooltip:
      enabled: false
  tooltip:
    shared: false
    # Always in the top right of the chart, so it never falls outside the card.
    fixed:
      enabled: true
      position: topRight
    # Compact box that wraps long reasons.
    custom: |
      EVAL:function({ seriesIndex, dataPointIndex, w }) {
        const x = w.globals.seriesX[seriesIndex][dataPointIndex];
        const plan = window.marstekTraderPlan || [];
        // Bars sit inside their slot, battery level points on the slot end.
        const isLine = w.config.series[seriesIndex].type === 'line';
        const slot = plan.find((s) => (isLine ? x <= new Date(s.end).getTime() : x < new Date(s.end).getTime()));
        if (!slot) return '';
        const time = (v) => new Date(v).toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' });
        const names = { charge: 'Laden', discharge: 'Ontladen', hold: 'Vasthouden', self_consumption: 'Zelfverbruik' };
        return '<div style="padding:6px 10px;max-width:240px;white-space:normal;line-height:1.4">'
          + '<b>' + time(slot.start) + ' - ' + time(slot.end) + ' · ' + (names[slot.action] || slot.action) + '</b><br>'
          + '€' + Number(slot.buy).toFixed(2) + '/kWh · batterij ' + Math.round(slot.soc_end) + '%'
          + (slot.reason ? '<br>' + slot.reason : '')
          + '</div>';
      }
series:
  # One column series per action, stacked so every slot shows one full bar.
  - entity: sensor.marstek_energy_trader_plan
    name: Laden
    type: column
    yaxis_id: price
    stack_group: plan
    color: "#1a9850"
    unit: €/kWh
    float_precision: 2
    show:
      in_header: false
      legend_value: false
    data_generator: |
      const plan = entity.attributes.plan || [];
      window.marstekTraderPlan = plan;
      const len = plan.length > 1 ? new Date(plan[1].end) - new Date(plan[1].start) : 3600000;
      return plan.map((s) => [new Date(s.end).getTime() - len / 2, s.action === 'charge' ? s.buy : null]);
  - entity: sensor.marstek_energy_trader_plan
    name: Ontladen
    type: column
    yaxis_id: price
    stack_group: plan
    color: "#d73027"
    unit: €/kWh
    float_precision: 2
    show:
      in_header: false
      legend_value: false
    data_generator: |
      const plan = entity.attributes.plan || [];
      const len = plan.length > 1 ? new Date(plan[1].end) - new Date(plan[1].start) : 3600000;
      return plan.map((s) => [new Date(s.end).getTime() - len / 2, s.action === 'discharge' ? s.buy : null]);
  - entity: sensor.marstek_energy_trader_plan
    name: Vasthouden
    type: column
    yaxis_id: price
    stack_group: plan
    color: "#9e9e9e"
    unit: €/kWh
    float_precision: 2
    show:
      in_header: false
      legend_value: false
    data_generator: |
      const plan = entity.attributes.plan || [];
      const len = plan.length > 1 ? new Date(plan[1].end) - new Date(plan[1].start) : 3600000;
      return plan.map((s) => [new Date(s.end).getTime() - len / 2, s.action === 'hold' ? s.buy : null]);
  - entity: sensor.marstek_energy_trader_plan
    name: Zelfverbruik
    type: column
    yaxis_id: price
    stack_group: plan
    color: "#4575b4"
    unit: €/kWh
    float_precision: 2
    show:
      in_header: false
      legend_value: false
    data_generator: |
      const plan = entity.attributes.plan || [];
      const len = plan.length > 1 ? new Date(plan[1].end) - new Date(plan[1].start) : 3600000;
      return plan.map((s) => [new Date(s.end).getTime() - len / 2, s.action === 'self_consumption' ? s.buy : null]);
  # Planned battery level at the end of each slot.
  - entity: sensor.marstek_energy_trader_plan
    name: Batterij
    type: line
    curve: straight
    stroke_width: 3
    yaxis_id: soc
    color: var(--primary-color)
    unit: "%"
    float_precision: 0
    show:
      in_header: false
      legend_value: false
    data_generator: |
      const plan = entity.attributes.plan || [];
      if (!plan.length) return [];
      const len = plan.length > 1 ? new Date(plan[1].end) - new Date(plan[1].start) : 3600000;
      return [[new Date(plan[0].end).getTime() - len, plan[0].soc_start]].concat(
        plan.map((s) => [new Date(s.end).getTime(), s.soc_end]));
  # Header: the expected savings of the plan.
  - entity: sensor.marstek_energy_trader_plan
    name: Verwachte besparing
    unit: €
    float_precision: 2
    show:
      in_chart: false
